<head>
<meta charset="UTF-8">

<title>Simulador McDonald's</title>

<style>
:root{
    --mc-red:#DA291C;
    --mc-yellow:#FFC72C;
    --success:#15803d;
    --danger:#b91c1c;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:"Segoe UI", system-ui, sans-serif;
    background:linear-gradient(180deg,#fff,#fff7e6);
}

.container{
    max-width:800px;
    margin:20px auto;
    padding:16px;
}

.card{
    background:white;
    border-radius:18px;
    padding:24px;
    box-shadow:0 15px 30px rgba(0,0,0,.1);
    border-top:8px solid var(--mc-red);
}

h1{
    text-align:center;
    color:var(--mc-red);
    margin-top:0;
}

.center{
    text-align:center;
}

.record{
    display:inline-block;
    background:var(--mc-yellow);
    padding:8px 16px;
    border-radius:999px;
    font-weight:700;
    margin-bottom:16px;
}

.timer{
    text-align:center;
    font-weight:700;
    color:var(--mc-red);
    margin:20px 0;
}

.question{
    font-size:1.1rem;
    font-weight:600;
    margin-bottom:16px;
}

.options{
    display:grid;
    gap:12px;
}

.options label{
    background:#fffbea;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    border:2px solid transparent;
}

.options label:hover{
    background:#fff3c4;
}

.options label:has(input:checked){
    border-color:var(--mc-red);
}

.options input{
    accent-color:var(--mc-red);
    transform:scale(1.2);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:var(--mc-red);
    color:white;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#b91c1c;
}

.result{
    text-align:center;
}

.success{color:var(--success);font-weight:800}
.fail{color:var(--danger);font-weight:800}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-box{
    background:white;
    border-radius:18px;
    padding:24px;
    max-width:360px;
    width:90%;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
    animation:pop .25s ease-out;
}

@keyframes pop{
    from{transform:scale(.85);opacity:0}
    to{transform:scale(1);opacity:1}
}

@media(max-width:480px){
    .card{padding:16px}
}
</style>
</head>

<div class="container">
<div class="card">

    <div id="startScreen" class="center">
        <h1>Simulador McDonald's</h1>

        <p>Examen de práctica – 30 minutos</p>
        <button onclick="startExam()">🍔 Empezar examen de prueba</button>
    </div>

    <!-- EXAMEN -->
    <div id="exam" style="display:none">
        <div class="timer" id="timer">30:00</div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <button onclick="nextQuestion()">Siguiente</button>
    </div>

    <!-- RESULTADO -->
    <div id="result" class="result" style="display:none"></div>

</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modal-title"></h3>

questions.sort(()=>Math.random()-0.5);
const selected = questions.slice(0,150);

let index=0, correct=0, time=1800, timerInt;
let bestRecord = localStorage.getItem("mc_record") || 0;
document.getElementById("record").innerText = `🏆 Récord: ${bestRecord}%`;

function startExam(){
    document.getElementById("startScreen").style.display="none";
    document.getElementById("exam").style.display="block";
    startTimer();
    showQuestion();
}

function showQuestion(){
    const q = selected[index];
    document.getElementById("question").innerText =
        `Pregunta ${index+1}: ${q.q}`;
    const opts = document.getElementById("options");
    opts.innerHTML="";
    let options=[q.a];
    while(options.length<4){
        let r=questions[Math.floor(Math.random()*questions.length)].a;
        if(!options.includes(r)) options.push(r);
    }
    options.sort(()=>Math.random()-0.5);
    options.forEach(o=>{
        const l=document.createElement("label");
        l.innerHTML=`<input type="radio" name="opt" value="${o}"><span>${o}</span>`;
        opts.appendChild(l);
    });
}

function nextQuestion(){
    const sel=document.querySelector("input[name='opt']:checked");
    if(!sel){
        showModal("⚠️ Atención","Selecciona una respuesta",false);
        return;
    }
    if(sel.value===selected[index].a){
        correct++;
        index++;
        index>=selected.length?finishExam():showQuestion();
    }else{
        showModal("❌ Incorrecto",
        `La respuesta correcta es:<br><strong>${selected[index].a}</strong>`,true);
    }
}

function finishExam(){
    clearInterval(timerInt);
    document.getElementById("exam").style.display="none";
    const percent=Math.round((correct/selected.length)*100);
    if(percent>bestRecord){
        bestRecord=percent;
        localStorage.setItem("mc_record",bestRecord);
    }
    document.getElementById("result").style.display="block";
    document.getElementById("result").innerHTML=`
        <h2>Resultado Final</h2>
        <p>${correct} / ${selected.length}</p>
        <p><strong>${percent}%</strong></p>
        <p class="${percent>=90?'success':'fail'}">
        ${percent>=90?'✅ APROBADO':'❌ REPROBADO'}
        </p>`;
}

function startTimer(){
    timerInt=setInterval(()=>{
        time--;
        let m=Math.floor(time/60), s=time%60;
        document.getElementById("timer").innerText=
        `${m}:${s<10?'0':''}${s}`;
        if(time<=0) finishExam();
    },1000);
}

/* MODAL */
function showModal(title,text,advance){
    document.getElementById("modal-title").innerHTML=title;
    document.getElementById("modal-text").innerHTML=text;
    document.getElementById("modal").style.display="flex";
    window.advanceAfterModal=advance;
}
function closeModal(){
    document.getElementById("modal").style.display="none";
    if(window.advanceAfterModal){
        index++;
        index>=selected.length?finishExam():showQuestion();
    }
}
</script>
